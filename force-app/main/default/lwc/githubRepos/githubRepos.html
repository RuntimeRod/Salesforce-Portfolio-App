<template>
  <lightning-card title="GitHub repositories" icon-name="utility:socialshare">
    <div class="slds-p-horizontal_small slds-p-bottom_small">
      <template lwc:if={isLoading}>
        <div class="slds-is-relative slds-m-vertical_large">
          <lightning-spinner
            alternative-text="Loading repositories"
            size="small"
          ></lightning-spinner>
        </div>
      </template>
      <template lwc:elseif={errorMessage}>
        <p class="slds-text-color_error">{errorMessage}</p>
      </template>
      <template lwc:elseif={hasRepos}>
        <div class="repo-grid">
          <template for:each={repos} for:item="repo">
            <article key={repo.name} class="repo-card">
              <a href={repo.htmlUrl} target="_blank" rel="noopener noreferrer"
                >{repo.name}</a
              >
              <p class="slds-text-body_small slds-m-top_xx-small">
                {repo.description}
              </p>
              <p class="repo-meta">
                <span lwc:if={repo.language} class="lang">{repo.language}</span>
                <span>{repo.stargazersCount} stars</span>
              </p>
            </article>
          </template>
        </div>
      </template>
      <template lwc:else>
        <p>
          No public repositories were returned for the configured GitHub
          username.
        </p>
      </template>
    </div>
  </lightning-card>
</template>
