name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do not fail the first push: org validation only runs after
      # Settings → Secrets → Actions → SFDX_AUTH_URL is set.
      # Never commit that URL. It is the org refresh-token login string.
      - name: Check if org auth secret is configured
        id: gate
        env:
          AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "$AUTH_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SFDX_AUTH_URL is not set. Skipping Salesforce org validation."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Salesforce CLI
        if: steps.gate.outputs.skip != 'true'
        run: npm install --global @salesforce/cli

      - name: Authenticate to org
        if: steps.gate.outputs.skip != 'true'
        env:
          AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          printf '%s\n' "$AUTH_URL" > auth-url.txt
          sf org login sfdx-url --sfdx-url-file auth-url.txt --alias ci-org --set-default
          rm -f auth-url.txt

      - name: Validate deploy (check-only) and run tests
        if: steps.gate.outputs.skip != 'true'
        run: sf project deploy validate --source-dir force-app --test-level RunLocalTests --target-org ci-org --wait 30
